# Default values for preprocessing-service-terminology
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/gravitate-health/preprocessing-service-terminology
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "preprocessing-service-terminology"

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Service Discovery Label - DO NOT MODIFY
# This label is required for discovery by the Gravitate Health Focusing Manager
serviceDiscovery:
  enabled: true
  label: "eu.gravitate-health.fosps.preprocessing"

# Environment Configuration
# Non-sensitive configuration via ConfigMap
config:
  # Application environment (prod, dev, staging)
  environment: "prod"
  # Terminology Server URL - CRITICAL: must be set appropriately for your environment
  termServerUrl: "http://terminology-service:3000"

# Secrets Configuration
# NOTE: DO NOT store actual secret values here. Use an external secret management solution
# or pass values via helm install --set flags or -f secret-values.yaml (in .gitignore)
secrets:
  # Example structure for future secret management
  # enabled: false
  # termServerAuthToken: ""

# Resource Management
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Node Affinity / Pod Affinity (optional)
# Uncomment and configure if needed for specific node targeting
# affinity: {}

# Tolerations (optional)
# tolerations: []

# Pod Security Context (optional)
# securityContext: {}

# Container Security Context (optional)
# containerSecurityContext: {}

# Log Level Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARN, ERROR, FATAL

# Node selector (optional)
# nodeSelector: {}
